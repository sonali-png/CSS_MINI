<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ball {
            width: 50px;
            height: 50px;
            background: #ff4757;
            border-radius: 50%;
            margin-bottom: 300px;
            animation: bounce 3s infinite alternate-reverse ease-in-out;

        }
        
        @keyframes bounce {
            0%   { transform: translateY(0);}
            100% { transform: translateY(500px); }
        }
    </style>
</head>
<body>
    <!-- Bouncing Ball
    Animate a circle moving up and down with easing to mimic a bouncing ball. -->
    <div class="ball">

    </div>
</body>
</html>
